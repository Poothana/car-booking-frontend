# Mathi Cabs — production nginx
# Prefer /var/www so www-data can read files (avoids 500 from /home/ubuntu permissions).
#
# Deploy files first:
#   cd /home/ubuntu/car-booking-frontend && npm run build
#   sudo mkdir -p /var/www/mathicabs.in
#   sudo rsync -a --delete /home/ubuntu/car-booking-frontend/dist/ /var/www/mathicabs.in/
#   sudo chown -R www-data:www-data /var/www/mathicabs.in
#
# Then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name mathicabs.in www.mathicabs.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name mathicabs.in www.mathicabs.in;

    ssl_certificate     /etc/letsencrypt/live/mathicabs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mathicabs.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/mathicabs.in;
    index index.html;

    access_log /var/log/nginx/mathicabs.access.log;
    error_log  /var/log/nginx/mathicabs.error.log;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml font/woff2;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:avif|webp|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico {
        try_files /favicon.png /logo.png =204;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
